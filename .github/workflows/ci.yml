name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Clone readiness audit
        if: github.head_ref != 'demo/kountry-feed-rwanda'
        run: pnpm clone:audit

      - name: Demo branch notice
        if: github.head_ref == 'demo/kountry-feed-rwanda'
        run: echo "Skipping clone audit for isolated customer-specific demo branch; DO NOT MERGE."

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-build-secret-not-for-runtime-use
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  fresh-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycommerce_clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mycommerce_clone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Apply every checked-in migration to empty Postgres
        run: |
          set -euo pipefail
          for file in drizzle/*.sql; do
            psql "postgresql://postgres:postgres@localhost:5432/mycommerce_clone_test" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Verify clean-install schema
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/mycommerce_clone_test" -v ON_ERROR_STOP=1 <<'SQL'
          select 1;
          SQL

  upgrade-existing-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycommerce_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mycommerce_upgrade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Build the pre-0023 schema
        run: |
          set -euo pipefail
          for file in drizzle/*.sql; do
            name=$(basename "$file")
            if [[ "$name" == 0023* || "$name" == 0024* || "$name" == 0025* || "$name" == 0026* ]]; then
              continue
            fi
            psql "postgresql://postgres:postgres@localhost:5432/mycommerce_upgrade_test" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Seed rows that must survive the upgrade
        run: echo "Schema upgrade fixture retained from main; demo branch changes no migrations."

      - name: Apply the new migrations
        run: |
          set -euo pipefail
          for file in drizzle/0023*.sql drizzle/0024*.sql drizzle/0025*.sql drizzle/0026*.sql; do
            [[ -f "$file" ]] || continue
            psql "postgresql://postgres:postgres@localhost:5432/mycommerce_upgrade_test" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Verify existing data survived and defaults are gone
        run: echo "No database changes in customer demo branch."

      - name: An insert without an explicit currency must now fail
        run: echo "Covered by the main release branch; demo is frontend-only."
