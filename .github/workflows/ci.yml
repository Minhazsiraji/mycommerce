name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Clone readiness audit
        run: pnpm clone:audit

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-build-secret-not-for-runtime-use
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  fresh-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycommerce_clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mycommerce_clone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Apply every checked-in migration to empty Postgres
        # The app's runtime migrator intentionally uses Neon's WebSocket driver,
        # which cannot connect to a localhost service. This CI gate therefore
        # exercises the exact checked-in SQL migration files directly, in journal
        # filename order, against an empty PostgreSQL 18 database. Vercel deploys
        # continue to exercise the actual Neon runtime migration runner.
        run: |
          set -euo pipefail
          for migration in $(find drizzle -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | sort); do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d mycommerce_clone_test -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Verify clean-install schema
        run: |
          psql -h localhost -U postgres -d mycommerce_clone_test -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.users') AS users_table;
          SELECT to_regclass('public.products') AS products_table;
          SELECT to_regclass('public.orders') AS orders_table;
          SELECT to_regclass('public.meta_integration_settings') AS meta_table;
          SELECT to_regclass('public.google_integration_settings') AS google_table;
          DO $$
          BEGIN
            IF to_regclass('public.users') IS NULL
              OR to_regclass('public.products') IS NULL
              OR to_regclass('public.orders') IS NULL
              OR to_regclass('public.meta_integration_settings') IS NULL
              OR to_regclass('public.google_integration_settings') IS NULL THEN
              RAISE EXCEPTION 'fresh clone schema verification failed';
            END IF;
          END $$;
          SQL
